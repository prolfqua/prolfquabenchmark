# What the benchmark runs, and on what. Each dataset is one input file, each method one analysis; the names are the
# ids in the results, the exported tables and the score history.

contrasts:
  ionstar:
    "dilution_(9/7.5)_1.2": "dilution.e - dilution.d"
    "dilution_(7.5/6)_1.25": "dilution.d - dilution.c"
    "dilution_(6/4.5)_1.3(3)": "dilution.c - dilution.b"
    "dilution_(4.5/3)_1.5": "dilution.b - dilution.a"
  cptac:
    b_vs_a: "group.b - group.a"
  proteobench:
    B_vs_A: "group.B - group.A"

# inputs: what the dataset provides. peptides and proteins: the prepared LFQData (results/prepared/<dataset>), proteins
# aggregated by prolfqua where the dataset has peptides; protein_table: the protein quantification of the search
# software (MaxQuant proteinGroups.txt LFQ intensities, FragPipe combined_protein.tsv), prepared as protein_table.rds;
# msstats_features: the feature table MSstats reads (FragPipe MSstats.csv)
# preprocessing: the steps from the input file to what the methods fit, shown in vignettes/Benchmark_results.Rmd
datasets:
  IonStar_MaxQuant:
    prepare: prepare_ionstar_maxquant.R
    inputs: [peptides, proteins]
    input_file: MAXQuant_IonStar2018_PXD003881.zip/peptides.txt
    description: "IonStar, MaxQuant peptides.txt"
    preprocessing:
      - "Contaminants and decoys (CON__, REV__) removed"
      - "Proteins with at least 2 peptides"
      - "Intensities below 4 (zeros) removed"
      - "log2, robust scaling on the human proteins"
      - "prolfqua protein models: peptides median-polished to proteins, weighted by the number of peptides"
      - "prolfqua peptide models and msqrob2: the normalized peptides (msqrob2 median-polishes them itself)"
    formula: "~ dilution."
    contrasts: ionstar
    ground_truth:
      id_column: protein_id
      positive: {label: ECOLI, pattern: ECOLI}
      negative: {label: HUMAN, pattern: HUMAN}
  IonStar_MaxQuant_protein:
    prepare: prepare_ionstar_maxquant_protein.R
    inputs: [proteins, protein_table]
    input_file: MAXQuant_IonStar2018_PXD003881.zip/proteinGroups.txt
    description: "IonStar, MaxQuant proteinGroups.txt (protein level)"
    preprocessing:
      - "LFQ intensities"
      - "Contaminants and decoys (CON__, REV__) removed"
      - "Proteins with at least 2 peptides"
      - "Intensities below 4 (zeros) removed"
      - "log2, robust scaling on the human proteins"
      - "Every method fits this protein table; the number of peptides weights the prolfqua fits and is the DEqMS count"
    formula: "~ dilution."
    contrasts: ionstar
    ground_truth:
      id_column: protein_id
      positive: {label: ECOLI, pattern: ECOLI}
      negative: {label: HUMAN, pattern: HUMAN}
  IonStar_FragPipe_MSstats:
    prepare: prepare_ionstar_fragpipe_msstats.R
    inputs: [peptides, proteins, msstats_features]
    input_file: MSFragger_IonStar2018_PXD003881.zip/IonstarWithMSFragger/MSstats.csv
    description: "IonStar, FragPipe MSstats.csv"
    preprocessing:
      - "Precursor intensities summed to peptides"
      - "Proteins with at least 2 peptides"
      - "Intensities below 4 (zeros) removed"
      - "log2, robust scaling on the human proteins"
      - "prolfqua protein models: peptides median-polished to proteins, weighted by the number of peptides"
      - "prolfqua peptide models and msqrob2: the normalized peptides (msqrob2 median-polishes them itself)"
      - "MSstats: the precursors of MSstats.csv, proteins with at least 2 peptides, its own dataProcess (log2, median equalization, Tukey median polish, imputation of censored values)"
    formula: "~ dilution."
    contrasts: ionstar
    ground_truth:
      id_column: protein_id
      positive: {label: ECOLI, pattern: ECOLI}
      negative: {label: HUMAN, pattern: HUMAN}
  IonStar_FragPipe_protein:
    prepare: prepare_ionstar_fragpipe_protein.R
    inputs: [proteins, protein_table]
    input_file: MSFragger_IonStar2018_PXD003881.zip/IonstarWithMSFragger/combined_protein.tsv
    description: "IonStar, FragPipe combined_protein.tsv (protein level)"
    preprocessing:
      - "Razor intensities"
      - "Proteins with at least 2 unique peptides"
      - "Intensities below 4 (zeros) removed"
      - "log2, robust scaling on the human proteins"
      - "Every method fits this protein table; the number of unique peptides weights the prolfqua fits and is the DEqMS count"
    formula: "~ dilution."
    contrasts: ionstar
    ground_truth:
      id_column: protein_id
      positive: {label: ECOLI, pattern: ECOLI}
      negative: {label: HUMAN, pattern: HUMAN}
  IonStar_MetaMorpheus:
    prepare: prepare_ionstar_metamorpheus.R
    inputs: [peptides, proteins]
    input_file: "Zenodo record 24418695 metamorpheus_ionstar.zip/QuantifiedPeaks.tsv (PXD057758)"
    description: "IonStar, MetaMorpheus 1.0.7 and FlashLFQ 1.3 QuantifiedPeaks.tsv, with match-between-runs (PIP)"
    preprocessing:
      - "Decoys and random-RT controls removed"
      - "Peak intensities summed to base sequences; identification confidence 1 for MS/MS peaks, 1 - PIP PEP for match-between-runs peaks"
      - "Protein groups of one organism (human or E. coli)"
      - "Proteins with at least 2 peptides"
      - "Intensities below 4 (zeros) removed"
      - "log2, robust scaling on the human proteins"
      - "prolfqua protein models: peptides median-polished to proteins, weighted by the number of peptides"
      - "prolfqua peptide models and msqrob2: the normalized peptides (msqrob2 median-polishes them itself)"
    formula: "~ dilution."
    contrasts: ionstar
    ground_truth:
      id_column: protein_id
      positive: {label: ECOLI, pattern: ECOLI}
      negative: {label: HUMAN, pattern: HUMAN}
  CPTAC_MaxQuant:
    prepare: prepare_cptac_maxquant.R
    inputs: [peptides, proteins]
    input_file: MsDataHub::cptac_a_b_peptides.txt()
    description: "CPTAC study 6, UPS1 in yeast, MaxQuant peptides.txt (Bioconductor MsDataHub)"
    preprocessing:
      - "Proteins with at least 2 peptides"
      - "Intensities below 4 (zeros) removed"
      - "vsn (variance-stabilizing transformation)"
      - "prolfqua protein models: peptides median-polished to proteins, weighted by the number of peptides"
      - "prolfqua peptide models and msqrob2: the normalized peptides (msqrob2 median-polishes them itself)"
    formula: "~ group."
    contrasts: cptac
    ground_truth:
      id_column: protein_id
      positive: {label: UPS, pattern: _UPS}
      negative: {label: YEAST, pattern: _YEAST}
  SingleCell_DIANN:
    prepare: prepare_singlecell_diann.R
    inputs: [peptides, proteins]
    input_file: "ProteoBench DIA single-cell submission 239b93c09a51038aab992c15c0702ff3658fe1c1 (DIA-NN 2.5.0)"
    description: "ProteoBench DIA single-cell (Orbitrap Astral, 250 pg), DIA-NN 2.5.0 report"
    preprocessing:
      - "Protein groups at 1% q-value (library and run)"
      - "Precursor quantities summed to stripped sequences; identification confidence 1 - the smallest precursor PEP"
      - "Protein groups of one species (ProteoBench FASTA); contaminants removed"
      - "Proteins with at least 2 peptides"
      - "Intensities below 4 (zeros) removed"
      - "log2, robust scaling on the human proteins"
      - "prolfqua protein models: peptides median-polished to proteins, weighted by the number of peptides"
      - "prolfqua peptide models and msqrob2: the normalized peptides (msqrob2 median-polishes them itself)"
    formula: "~ group."
    contrasts: proteobench
    ground_truth:
      id_column: protein_id
      positive: {label: YEAST, pattern: _YEAST}
      negative: {label: HUMAN, pattern: _HUMAN}
  SingleCell_MaxQuant:
    prepare: prepare_singlecell_maxquant.R
    inputs: [peptides, proteins]
    input_file: "ProteoBench DIA single-cell submission 090d5f63ab4b453cbbc318eb5f8ccfe557ab8621 (MaxQuant 2.7.5.0)"
    description: "ProteoBench DIA single-cell (Orbitrap Astral, 250 pg), MaxQuant 2.7.5.0 DIA evidence.txt"
    preprocessing:
      - "Proteotypic evidence, decoys removed"
      - "Evidence intensities summed to peptides; identification confidence 1 - the smallest evidence PEP"
      - "Leading razor proteins of one species (ProteoBench FASTA); contaminants removed"
      - "Proteins with at least 2 peptides"
      - "Intensities below 4 (zeros) removed"
      - "log2, robust scaling on the human proteins"
      - "prolfqua protein models: peptides median-polished to proteins, weighted by the number of peptides"
      - "prolfqua peptide models and msqrob2: the normalized peptides (msqrob2 median-polishes them itself)"
    formula: "~ group."
    contrasts: proteobench
    ground_truth:
      id_column: protein_id
      positive: {label: YEAST, pattern: _YEAST}
      negative: {label: HUMAN, pattern: _HUMAN}
  diaPASEF_DIANN:
    prepare: prepare_diapasef_diann.R
    inputs: [peptides, proteins]
    input_file: "ProteoBench DIA diaPASEF submission 53bb223d26d0227ac35d403947eb7de30decf38d (DIA-NN 2.5.0)"
    description: "ProteoBench DIA diaPASEF (timsTOF, human/yeast/E. coli; E. coli 4x up, yeast 2x down), DIA-NN 2.5.0 report"
    preprocessing:
      - "Protein groups at 1% q-value (library and run)"
      - "Precursor quantities summed to stripped sequences; identification confidence 1 - the smallest precursor PEP"
      - "Protein groups of one species (ProteoBench FASTA); contaminants removed"
      - "Proteins with at least 2 peptides"
      - "Intensities below 4 (zeros) removed"
      - "log2, robust scaling on the human proteins"
      - "prolfqua protein models: peptides median-polished to proteins, weighted by the number of peptides"
      - "prolfqua peptide models and msqrob2: the normalized peptides (msqrob2 median-polishes them itself)"
    formula: "~ group."
    contrasts: proteobench
    ground_truth:
      id_column: protein_id
      positive: {label: YEAST_ECOLI, pattern: _YEAST|_ECOLI, down: _YEAST}
      negative: {label: HUMAN, pattern: _HUMAN}
  diaPASEF_Spectronaut:
    prepare: prepare_diapasef_spectronaut.R
    inputs: [peptides, proteins]
    input_file: "ProteoBench DIA diaPASEF submission e0b85747554042cf392ea706aee617abcf70901f (Spectronaut 21.0)"
    description: "ProteoBench DIA diaPASEF (timsTOF, human/yeast/E. coli; E. coli 4x up, yeast 2x down), Spectronaut 21.0 report"
    preprocessing:
      - "Precursor quantities summed to peptides (PEP.GroupingKey); identification confidence 1 - the smallest precursor q-value"
      - "Protein groups of one species (ProteoBench FASTA); contaminants removed"
      - "Proteins with at least 2 peptides"
      - "Intensities below 4 (zeros) removed"
      - "log2, robust scaling on the human proteins"
      - "prolfqua protein models: peptides median-polished to proteins, weighted by the number of peptides"
      - "prolfqua peptide models and msqrob2: the normalized peptides (msqrob2 median-polishes them itself)"
    formula: "~ group."
    contrasts: proteobench
    ground_truth:
      id_column: protein_id
      positive: {label: YEAST_ECOLI, pattern: _YEAST|_ECOLI, down: _YEAST}
      negative: {label: HUMAN, pattern: _HUMAN}

# Every method runs on every dataset that provides all of its inputs.
# tool: prolfqua (fitted with build_contrast_analysis(), method = facade) or an external tool
# input: the dataset inputs the method needs; the external tools take only their own input (MSstats its feature
# table, msqrob2 the peptides, proDA and msqrob2_protein the protein table), never the proteins prolfqua aggregated
# level: protein, peptide (peptide models, one result per protein), or protein + peptide (hurdle)
methods:
  prolfqua_lm:
    tool: prolfqua
    script: fit_prolfqua.R
    facade: lm
    input: [proteins]
    level: protein
    description: "lm with variance moderation; no contrast where a group has no observations"
  prolfqua_rlm:
    tool: prolfqua
    script: fit_prolfqua.R
    facade: rlm
    input: [proteins]
    level: protein
    description: "robust linear model (MASS::rlm) with variance moderation"
  prolfqua_lm_impute:
    tool: prolfqua
    script: fit_prolfqua.R
    facade: lm_impute
    input: [proteins]
    level: protein
    description: "lm with imputed group means where a group has no observations"
  prolfqua_limma:
    tool: prolfqua
    script: fit_prolfqua.R
    facade: limma
    input: [proteins]
    level: protein
    description: "limma empirical Bayes"
  prolfqua_deqms:
    tool: prolfqua
    script: fit_prolfqua.R
    facade: deqms
    input: [proteins]
    level: protein
    description: "lm with DEqMS moderation (variance prior by number of peptides)"
  prolfqua_deqms_voom:
    tool: prolfqua
    script: fit_prolfqua.R
    facade: deqms_voom
    input: [proteins]
    level: protein
    description: "limma with vooma precision weights and DEqMS moderation"
  prolfqua_limpa:
    tool: prolfqua
    script: fit_prolfqua.R
    facade: limpa
    input: [proteins]
    level: protein
    description: "limpa vooma fit with imputation-aware degrees of freedom on the proteins"
  prolfqua_lmer_nested:
    tool: prolfqua
    script: fit_prolfqua.R
    facade: lmer_nested
    formula_terms: "+ (1 | peptide_Id) + (1 | sampleName)"
    input: [peptides]
    level: peptide
    description: "mixed model, peptide and sample random effects"
  prolfqua_ropeca_nested:
    tool: prolfqua
    script: fit_prolfqua.R
    facade: ropeca_nested
    input: [peptides]
    level: peptide
    description: "ROPECA, beta null of the median signed p-value"
  prolfqua_ropecaV2_nested:
    tool: prolfqua
    script: fit_prolfqua.R
    facade: ropecaV2_nested
    input: [peptides]
    level: peptide
    description: "ROPECA, correlation-aware null of the median z-score"
  prolfqua_limpa_nested:
    tool: prolfqua
    script: fit_prolfqua.R
    facade: limpa_nested
    input: [peptides]
    level: peptide
    description: "limpa: DPC quantification of the peptides to proteins, vooma fit"
  prolfqua_hurdle_nested:
    tool: prolfqua
    script: fit_prolfqua.R
    facade: hurdle_nested
    input: [peptides]
    level: protein + peptide
    description: "hurdle: lm_impute on median-polished proteins and binomial_firth_nested on peptide detection, Fisher"
  MSstats:
    tool: MSstats
    script: fit_msstats.R
    input: [msstats_features]
    level: protein
    description: "MSstats dataProcess (feature summarization) and groupComparison"
  proDA:
    tool: proDA
    script: fit_proda.R
    input: [protein_table]
    level: protein
    description: "proDA on the protein table of the search software"
  msqrob2:
    tool: msqrob2
    script: fit_msqrob2.R
    combine: intensity_first
    input: [peptides, proteins]
    level: protein + peptide
    description: "msqrob2 hurdle; intensity estimate where it exists, else the detection estimate"
  msqrob2_hurdle:
    tool: msqrob2
    script: fit_msqrob2.R
    combine: fisher
    input: [peptides, proteins]
    level: protein + peptide
    description: "msqrob2 hurdle; Fisher combination of the intensity and detection p-values"
  msqrob2_protein:
    tool: msqrob2
    script: fit_msqrob2.R
    input: [protein_table]
    level: protein
    description: "msqrob2 msqrob on the protein table of the search software, no detection model"
