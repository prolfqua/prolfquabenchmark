# What the benchmark runs, and on what. Each dataset is one input table, each method one analysis; the names are the
# ids in the results, the exported tables and the score history.

contrasts:
  ionstar:
    "dilution_(9/7.5)_1.2": "dilution.e - dilution.d"
    "dilution_(7.5/6)_1.25": "dilution.d - dilution.c"
    "dilution_(6/4.5)_1.3(3)": "dilution.c - dilution.b"
    "dilution_(4.5/3)_1.5": "dilution.b - dilution.a"
  cptac:
    b_vs_a: "group.b - group.a"

# inputs: what the dataset provides. peptides and proteins: the prepared LFQData (results/prepared/<dataset>);
# msstats_features: the feature table MSstats reads (MaxQuant evidence.txt, FragPipe MSstats.csv);
# lfq_proteins: the MaxQuant LFQ protein intensities (proteinGroups.txt)
datasets:
  IonStar_MaxQuant:
    prepare: prepare_ionstar_maxquant.R
    inputs: [peptides, proteins, msstats_features, lfq_proteins]
    input_file: MAXQuant_IonStar2018_PXD003881.zip/peptides.txt
    description: "IonStar, MaxQuant peptides.txt; log2, robust scaling on the human proteins, median polish to proteins"
    formula: "~ dilution."
    contrasts: ionstar
    ground_truth:
      id_column: protein_id
      positive: {label: ECOLI, pattern: ECOLI}
      negative: {label: HUMAN, pattern: HUMAN}
  IonStar_FragPipe_MSstats:
    prepare: prepare_ionstar_fragpipe_msstats.R
    inputs: [peptides, proteins, msstats_features]
    input_file: MSFragger_IonStar2018_PXD003881.zip/IonstarWithMSFragger/MSstats.csv
    description: "IonStar, FragPipe MSstats.csv; precursors summed to peptides, log2, robust scaling on the human proteins, median polish to proteins"
    formula: "~ dilution."
    contrasts: ionstar
    ground_truth:
      id_column: protein_id
      positive: {label: ECOLI, pattern: ECOLI}
      negative: {label: HUMAN, pattern: HUMAN}
  IonStar_FragPipe_protein:
    prepare: prepare_ionstar_fragpipe_protein.R
    inputs: [proteins]
    input_file: MSFragger_IonStar2018_PXD003881.zip/IonstarWithMSFragger/combined_protein.tsv
    description: "IonStar, FragPipe combined_protein.tsv (protein level); razor intensities, log2, robust scaling on the human proteins"
    formula: "~ dilution."
    contrasts: ionstar
    ground_truth:
      id_column: protein_id
      positive: {label: ECOLI, pattern: ECOLI}
      negative: {label: HUMAN, pattern: HUMAN}
  CPTAC_MaxQuant:
    prepare: prepare_cptac_maxquant.R
    inputs: [peptides, proteins]
    input_file: MsDataHub::cptac_a_b_peptides.txt()
    description: "CPTAC study 6, UPS1 in yeast, MaxQuant peptides.txt (Bioconductor MsDataHub); vsn, median polish to proteins"
    formula: "~ group."
    contrasts: cptac
    ground_truth:
      id_column: protein_id
      positive: {label: UPS, pattern: _UPS}
      negative: {label: YEAST, pattern: _YEAST}

# Every method runs on every dataset that provides all of its inputs.
# tool: prolfqua (fitted with build_contrast_analysis(), method = facade) or an external tool
# input: the dataset inputs the method needs
# level: protein, peptide (peptide models, one result per protein), or protein + peptide (hurdle)
# packages: loaded before fitting (prolfquatakeoutmissing registers the lm_missing facade)
methods:
  prolfqua_lm:
    tool: prolfqua
    script: fit_prolfqua.R
    facade: lm_missing
    packages: [prolfquatakeoutmissing]
    input: [proteins]
    level: protein
    description: "lm with missing-value merge and variance moderation (lm_missing, prolfquatakeoutmissing)"
  prolfqua_limma:
    tool: prolfqua
    script: fit_prolfqua.R
    facade: limma
    input: [proteins]
    level: protein
    description: "limma empirical Bayes"
  lm_impute:
    tool: prolfqua
    script: fit_prolfqua.R
    facade: lm_impute
    input: [proteins]
    level: protein
    description: "lm with imputed group means where a group has no observations (lm_impute)"
  lmer_nested:
    tool: prolfqua
    script: fit_prolfqua.R
    facade: lmer_nested
    formula_terms: "+ (1 | peptide_Id) + (1 | sampleName)"
    input: [peptides]
    level: peptide
    description: "mixed model, peptide and sample random effects"
  ropeca_nested:
    tool: prolfqua
    script: fit_prolfqua.R
    facade: ropeca_nested
    input: [peptides]
    level: peptide
    description: "ROPECA, beta null of the median signed p-value"
  ropecaV2_nested:
    tool: prolfqua
    script: fit_prolfqua.R
    facade: ropecaV2_nested
    input: [peptides]
    level: peptide
    description: "ROPECA, correlation-aware null of the median z-score"
  hurdle_nested:
    tool: prolfqua
    script: fit_prolfqua.R
    facade: hurdle_nested
    input: [peptides]
    level: protein + peptide
    description: "hurdle: lm_impute on median-polished proteins and binomial_firth_nested on peptide detection, Fisher"
  MSstats:
    tool: MSstats
    script: fit_msstats.R
    input: [msstats_features]
    level: protein
    description: "MSstats dataProcess (feature summarization) and groupComparison"
  proDA:
    tool: proDA
    script: fit_proda.R
    input: [proteins]
    level: protein
    description: "proDA on the prepared proteins"
  proDA_LFQ:
    tool: proDA
    script: fit_proda.R
    input: [lfq_proteins]
    level: protein
    description: "proDA on the MaxQuant LFQ protein intensities (proteinGroups.txt)"
  msqrob2:
    tool: msqrob2
    script: fit_msqrob2.R
    combine: intensity_first
    input: [peptides, proteins]
    level: protein + peptide
    description: "msqrob2 hurdle; intensity estimate where it exists, else the detection estimate"
  msqrob2_hurdle:
    tool: msqrob2
    script: fit_msqrob2.R
    combine: fisher
    input: [peptides, proteins]
    level: protein + peptide
    description: "msqrob2 hurdle; Fisher combination of the intensity and detection p-values"
  msqrob2_protein:
    tool: msqrob2
    script: fit_msqrob2.R
    input: [proteins]
    level: protein
    description: "msqrob2 msqrob on the prepared proteins, no detection model"
